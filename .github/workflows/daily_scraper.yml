name: Daily Poultry Price Scraper

# Pings the Render deploy hook once per day. The Render build.sh runs
# `python manage.py fetch_market_rates` as its last step, so pinging the
# deploy hook is enough to refresh today's Punjab rates in Firestore and
# trigger the FCM push via the Cloud Function.
#
# Scheduled for 01:30 UTC = 06:30 Asia/Karachi — matches when the Lahore
# Market Committee typically publishes the day's image.
#
# Workflow-dispatch lets you trigger it manually from the Actions tab
# (handy for the FYP defense demo).

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  ping_render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render deploy hook
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$DEPLOY_URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json || true
          echo
          # Render returns 201 on a successful deploy trigger.
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Deploy hook returned $HTTP_CODE"
            exit 1
          fi
